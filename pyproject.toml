[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-server"
version = "0.1.0"
description = "A minimal FastAPI hello server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "starlette>=0.46,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.8,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[tool.setuptools.packages.find]
include = ["hello_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hello_server"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
